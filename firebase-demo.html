
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firebase Connection Test</title>
</head>
<body>
  <h1>Firebase Test</h1>
  <p id="status">Connecting to Firebase...</p>

  <button id="saveBtn" disabled>Save test profile</button>
  <button id="loadBtn" disabled>Load test profile</button>
  <pre id="result"></pre>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    // Replace this example with your Firebase web app config.
    const firebaseConfig = {
      apiKey: "AIzaSyCqWmZU7nap7dqYTRfJTExjaQjXHuYMDUg",
      authDomain: "zero-to-a-hundred.firebaseapp.com",
      projectId: "zero-to-a-hundred",
      appId: "1:25213335490:web:6bd96da8687e3a99f1085b"
    };

    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const saveBtn = document.getElementById("saveBtn");
    const loadBtn = document.getElementById("loadBtn");

    async function start() {
      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const credential = await signInAnonymously(auth);
        const user = credential.user;

        // Each anonymous user gets their own test document.
        const profileRef = doc(db, "demoProfiles", user.uid);

        status.textContent = "Connected! Anonymous sign-in worked.";
        result.textContent = "Test user ID: " + user.uid;
        saveBtn.disabled = false;
        loadBtn.disabled = false;

        saveBtn.onclick = async () => {
          try {
            await setDoc(profileRef, {
              nickname: "Test Player",
              theme: "dark",
              updatedAt: new Date().toISOString()
            });

            result.textContent = "Success! Test profile saved.";
          } catch (error) {
            result.textContent = "Save error: " + error.message;
          }
        };

        loadBtn.onclick = async () => {
          try {
            const snapshot = await getDoc(profileRef);

            result.textContent = snapshot.exists()
              ? JSON.stringify(snapshot.data(), null, 2)
              : "No test profile found yet. Click Save first.";
          } catch (error) {
            result.textContent = "Load error: " + error.message;
          }
        };
      } catch (error) {
        status.textContent = "Connection failed.";
        result.textContent = error.code + ": " + error.message;
      }
    }

    start();
  </script>
</body>
</html>
